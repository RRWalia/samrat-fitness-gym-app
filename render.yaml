services:
  - type: web
    name: samrat-fitness-gym-app
    env: node
    plan: free
    region: singapore # Closest low-latency region to India
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: GYM_NAME
        value: "Samrat Fitness King"
      - key: TIMEZONE
        value: "Asia/Kolkata"
      - key: JWT_SECRET
        generateValue: true
      # Sign in with Google (Web OAuth client ID). REQUIRED: Google is the only
      # sign-in method. Add the Render service origin to the client's
      # "Authorized JavaScript origins" in the Google Cloud console.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: INITIAL_OWNER_EMAIL
        sync: false
      - key: INITIAL_OWNER_NAME
        value: "Ashish"
      # Optional first-run staff Gmails. Omit any you do not need.
      # - key: INITIAL_MANAGER_EMAIL
      #   sync: false
      # - key: INITIAL_MANAGER_NAME
      #   value: "Parmar"
      # - key: INITIAL_FRONT_DESK_EMAIL
      #   sync: false
      # - key: INITIAL_FRONT_DESK_NAME
      #   value: "Front Desk Team"
      # - key: INITIAL_TRAINER_EMAIL
      #   sync: false
      # - key: INITIAL_TRAINER_NAME
      #   value: "Sona Walia"
